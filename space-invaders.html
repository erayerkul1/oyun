<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05050f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #eee;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 480px;
    padding: 8px 4px;
    font-size: 14px;
    letter-spacing: 1px;
  }
  #hud span { color: #a0c4ff; }
  #wrapper {
    position: relative;
    width: 480px;
    height: 600px;
  }
  canvas {
    display: block;
    background: #05050f;
    border: 2px solid #1a1a3a;
    border-radius: 4px;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5,5,15,0.88);
    border-radius: 4px;
    gap: 14px;
    pointer-events: all;
  }
  #overlay h1 { font-size: 32px; color: #a0c4ff; letter-spacing: 4px; }
  #overlay p  { font-size: 14px; color: #888; }
  #overlay .big { font-size: 20px; color: #ffd6a5; }
  #overlay.hidden { display: none; pointer-events: none; }
  #legend {
    display: flex;
    gap: 16px;
    width: 480px;
    padding: 5px 4px 0;
    font-size: 12px;
    color: #555;
  }
  #legend b { color: #777; }
</style>
</head>
<body>

<div id="hud">
  <div>PUAN: <span id="scoreVal">0</span></div>
  <div>WAVE: <span id="waveVal">1</span></div>
  <div>CAN: <span id="livesVal">❤️❤️❤️</span></div>
</div>
<div id="wrapper">
  <canvas id="c" width="480" height="600"></canvas>
  <div id="overlay">
    <h1 id="oTitle">SPACE SHOOTER</h1>
    <p class="big" id="oScore" style="display:none"></p>
    <p id="oMsg">SPACE veya tıkla ile başla</p>
    <p style="color:#444;font-size:12px">↑↓←→ hareket &nbsp;|&nbsp; SPACE ateş</p>
  </div>
</div>
<div id="legend">
  <div><b>Drone</b> — düz, 1 HP, 10p</div>
  <div><b>Zigzag</b> — dalgalı, 2 HP, 20p</div>
  <div><b>Tank</b> — yavaş, 3 HP, 40p</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const oTitle  = document.getElementById('oTitle');
const oScore  = document.getElementById('oScore');
const oMsg    = document.getElementById('oMsg');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('scoreVal');
const waveEl  = document.getElementById('waveVal');
const livesEl = document.getElementById('livesVal');

const W = 480, H = 600;

// ---- constants ----
const PLAYER_W = 34, PLAYER_H = 40;
const PLAYER_SPD = 4.5;
const PLAYER_BULL_SPD = 9;
const PLAYER_FIRE_RATE = 14; // frames between shots
const INVINCIBLE_FRAMES = 90;

const ENEMY_BULL_SPD = 3;
const BULL_W = 4, BULL_H = 12;

const ENEMY_DEF = {
  drone:  { w: 28, h: 24, hp: 1, spd: 2.2, pts: 10,  color: '#74c0fc', fireRate: 120 },
  zigzag: { w: 30, h: 26, hp: 2, spd: 1.8, pts: 20,  color: '#cc5de8', fireRate: 90  },
  tank:   { w: 38, h: 32, hp: 3, spd: 1.0, pts: 40,  color: '#ff6b6b', fireRate: 60  },
};

// ---- state ----
let state = 'idle';
let score, lives, wave;
let player, playerBullets, enemies, enemyBullets;
let fireCooldown, waveMsg, waveTimer;

// ---- stars ----
const STARS = Array.from({length: 120}, () => ({
  x: Math.random() * W,
  y: Math.random() * H,
  spd: 0.4 + Math.random() * 1.2,
  sz: Math.random() < 0.15 ? 2 : 1,
  bright: 0.3 + Math.random() * 0.7
}));

function scrollStars() {
  for (const s of STARS) {
    s.y += s.spd;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }
}

// ---- wave spawn ----
function spawnWave(waveNum) {
  enemies = [];
  const count  = 4 + waveNum * 2;
  const types  = ['drone','drone','zigzag','tank'];
  const typeW  = Math.min(waveNum - 1, 3); // unlock types gradually

  for (let i = 0; i < count; i++) {
    const typePool = types.slice(0, Math.min(typeW + 1, types.length));
    const kind = typePool[Math.floor(Math.random() * typePool.length)];
    const def  = ENEMY_DEF[kind];
    enemies.push({
      kind,
      x: 20 + Math.random() * (W - def.w - 40),
      y: -def.h - i * 60,
      hp: def.hp,
      maxHp: def.hp,
      w: def.w, h: def.h,
      spd: def.spd + (waveNum - 1) * 0.1,
      pts: def.pts,
      color: def.color,
      fireTimer: Math.floor(Math.random() * def.fireRate),
      fireRate: def.fireRate,
      phase: Math.random() * Math.PI * 2, // for zigzag
      alive: true
    });
  }
}

// ---- init ----
function initGame() {
  score  = 0;
  lives  = 3;
  wave   = 1;
  player = {
    x: W / 2 - PLAYER_W / 2,
    y: H - 80,
    invincible: 0
  };
  playerBullets = [];
  enemyBullets  = [];
  fireCooldown  = 0;
  waveMsg  = 'WAVE 1';
  waveTimer = 90;
  spawnWave(wave);
  updateHUD();
}

function nextWave() {
  wave++;
  enemyBullets  = [];
  playerBullets = [];
  spawnWave(wave);
  waveMsg   = 'WAVE ' + wave;
  waveTimer = 90;
  updateHUD();
}

function updateHUD() {
  scoreEl.textContent = score;
  waveEl.textContent  = wave;
  livesEl.textContent = '❤️'.repeat(Math.max(0, lives));
}

function showOverlay(title, msg, showScore) {
  overlay.classList.remove('hidden');
  oTitle.textContent = title;
  oMsg.textContent   = msg;
  if (showScore) {
    oScore.style.display = '';
    oScore.textContent   = 'PUAN: ' + score;
  } else {
    oScore.style.display = 'none';
  }
}
function hideOverlay() { overlay.classList.add('hidden'); }

// ---- input ----
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') {
    e.preventDefault();
    if (state === 'idle' || state === 'gameover') { initGame(); hideOverlay(); state = 'playing'; }
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
overlay.addEventListener('click', () => {
  if (state === 'idle' || state === 'gameover') { initGame(); hideOverlay(); state = 'playing'; }
});

// ---- logic ----
function step() {
  if (state !== 'playing') return;

  scrollStars();
  if (waveTimer > 0) waveTimer--;

  // player move
  if (keys['ArrowLeft'])  player.x -= PLAYER_SPD;
  if (keys['ArrowRight']) player.x += PLAYER_SPD;
  if (keys['ArrowUp'])    player.y -= PLAYER_SPD;
  if (keys['ArrowDown'])  player.y += PLAYER_SPD;
  player.x = Math.max(0, Math.min(W - PLAYER_W, player.x));
  player.y = Math.max(0, Math.min(H - PLAYER_H, player.y));
  if (player.invincible > 0) player.invincible--;

  // player fire
  if (fireCooldown > 0) fireCooldown--;
  if (keys['Space'] && fireCooldown === 0) {
    playerBullets.push({ x: player.x + PLAYER_W / 2 - BULL_W / 2, y: player.y });
    fireCooldown = PLAYER_FIRE_RATE;
  }

  // player bullets
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    b.y -= PLAYER_BULL_SPD;
    if (b.y + BULL_H < 0) { playerBullets.splice(i, 1); continue; }
    // vs enemies
    let hit = false;
    for (const e of enemies) {
      if (!e.alive) continue;
      if (rectsOverlap(b.x, b.y, BULL_W, BULL_H, e.x, e.y, e.w, e.h)) {
        e.hp--;
        if (e.hp <= 0) { e.alive = false; score += e.pts; updateHUD(); }
        playerBullets.splice(i, 1);
        hit = true;
        break;
      }
    }
  }

  // enemies
  let t = performance.now() * 0.001;
  for (const e of enemies) {
    if (!e.alive) continue;
    e.y += e.spd;
    if (e.kind === 'zigzag') {
      e.x += Math.sin(t * 2.5 + e.phase) * 2.5;
      e.x  = Math.max(0, Math.min(W - e.w, e.x));
    }
    if (e.kind === 'tank') {
      e.x += Math.sin(t * 1.2 + e.phase) * 1.5;
      e.x  = Math.max(0, Math.min(W - e.w, e.x));
    }
    // enemy shoot
    e.fireTimer--;
    if (e.fireTimer <= 0) {
      e.fireTimer = e.fireRate + Math.floor(Math.random() * 30);
      const cx = e.x + e.w / 2;
      const cy = e.y + e.h;
      if (e.kind === 'tank') {
        for (const dx of [-0.4, 0, 0.4]) {
          enemyBullets.push({ x: cx - BULL_W / 2, y: cy, vx: dx * ENEMY_BULL_SPD, vy: ENEMY_BULL_SPD });
        }
      } else if (e.kind === 'zigzag') {
        for (const dx of [-0.25, 0.25]) {
          enemyBullets.push({ x: cx - BULL_W / 2, y: cy, vx: dx * ENEMY_BULL_SPD, vy: ENEMY_BULL_SPD });
        }
      } else {
        enemyBullets.push({ x: cx - BULL_W / 2, y: cy, vx: 0, vy: ENEMY_BULL_SPD });
      }
    }
    // enemy out of bounds — it passes through (no life lost, just gone)
    if (e.y > H + e.h) e.alive = false;
  }

  // enemy bullets
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx;
    b.y += b.vy;
    if (b.y > H || b.x < -10 || b.x > W + 10) { enemyBullets.splice(i, 1); continue; }
    // vs player
    if (
      player.invincible === 0 &&
      rectsOverlap(b.x, b.y, BULL_W, BULL_H, player.x + 4, player.y + 6, PLAYER_W - 8, PLAYER_H - 10)
    ) {
      enemyBullets.splice(i, 1);
      player.invincible = INVINCIBLE_FRAMES;
      lives--;
      updateHUD();
      if (lives <= 0) {
        state = 'gameover';
        showOverlay('GAME OVER', 'SPACE veya tıkla ile yeniden başla', true);
        return;
      }
    }
  }

  // next wave?
  if (enemies.every(e => !e.alive)) nextWave();
}

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// ---- draw ----
function drawStars() {
  for (const s of STARS) {
    ctx.fillStyle = `rgba(255,255,255,${s.bright})`;
    ctx.fillRect(s.x, s.y, s.sz, s.sz);
  }
}

function drawPlayer() {
  if (player.invincible > 0 && Math.floor(player.invincible / 6) % 2 === 0) return;
  const x = player.x, y = player.y;
  // engine glow
  ctx.shadowColor = '#339af0';
  ctx.shadowBlur  = 14;
  // body
  ctx.fillStyle = '#74c0fc';
  ctx.beginPath();
  ctx.moveTo(x + PLAYER_W / 2, y);
  ctx.lineTo(x + PLAYER_W, y + PLAYER_H * 0.7);
  ctx.lineTo(x + PLAYER_W * 0.7, y + PLAYER_H * 0.6);
  ctx.lineTo(x + PLAYER_W * 0.7, y + PLAYER_H);
  ctx.lineTo(x + PLAYER_W * 0.3, y + PLAYER_H);
  ctx.lineTo(x + PLAYER_W * 0.3, y + PLAYER_H * 0.6);
  ctx.lineTo(x, y + PLAYER_H * 0.7);
  ctx.closePath();
  ctx.fill();
  // cockpit
  ctx.fillStyle = '#a0c4ff';
  ctx.beginPath();
  ctx.ellipse(x + PLAYER_W / 2, y + PLAYER_H * 0.35, 7, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // engine flame
  const flameH = 8 + Math.random() * 6;
  const grad = ctx.createLinearGradient(0, y + PLAYER_H, 0, y + PLAYER_H + flameH);
  grad.addColorStop(0, '#ffd43b');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(x + PLAYER_W * 0.3 + 2, y + PLAYER_H);
  ctx.lineTo(x + PLAYER_W * 0.5, y + PLAYER_H + flameH);
  ctx.lineTo(x + PLAYER_W * 0.7 - 2, y + PLAYER_H);
  ctx.closePath();
  ctx.fill();
}

function drawEnemy(e) {
  const x = e.x, y = e.y, w = e.w, h = e.h;
  ctx.shadowColor = e.color;
  ctx.shadowBlur  = 8;
  ctx.fillStyle   = e.color;

  if (e.kind === 'drone') {
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y + h);
    ctx.lineTo(x + w, y);
    ctx.lineTo(x, y);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff3';
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + h * 0.4, 5, 4, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (e.kind === 'zigzag') {
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y + h);
    ctx.lineTo(x + w, y + h * 0.3);
    ctx.lineTo(x + w * 0.7, y);
    ctx.lineTo(x + w * 0.3, y);
    ctx.lineTo(x, y + h * 0.3);
    ctx.closePath();
    ctx.fill();
    // twin cannons hint
    ctx.fillStyle = '#fff5';
    ctx.fillRect(x + w * 0.2 - 2, y + h * 0.6, 4, 8);
    ctx.fillRect(x + w * 0.8 - 2, y + h * 0.6, 4, 8);
  } else {
    // tank — chunky
    ctx.beginPath();
    ctx.roundRect(x, y + h * 0.2, w, h * 0.8, 4);
    ctx.fill();
    ctx.fillStyle = '#fff2';
    ctx.beginPath();
    ctx.roundRect(x + w * 0.2, y, w * 0.6, h * 0.5, 3);
    ctx.fill();
    // HP bar
    const barW = w - 4;
    ctx.fillStyle = '#333';
    ctx.fillRect(x + 2, y - 7, barW, 4);
    ctx.fillStyle = e.hp === 1 ? '#ff6b6b' : e.hp === 2 ? '#ffa94d' : '#69db7c';
    ctx.fillRect(x + 2, y - 7, barW * (e.hp / e.maxHp), 4);
  }
  ctx.shadowBlur = 0;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawStars();

  // enemies
  for (const e of enemies) { if (e.alive) drawEnemy(e); }

  // player bullets
  ctx.shadowColor = '#a0c4ff';
  ctx.shadowBlur  = 8;
  ctx.fillStyle   = '#a0c4ff';
  for (const b of playerBullets) ctx.fillRect(b.x, b.y, BULL_W, BULL_H);
  ctx.shadowBlur = 0;

  // enemy bullets
  ctx.shadowColor = '#ff6b6b';
  ctx.shadowBlur  = 6;
  ctx.fillStyle   = '#ff9999';
  for (const b of enemyBullets) {
    ctx.beginPath();
    ctx.ellipse(b.x + BULL_W / 2, b.y + BULL_H / 2, BULL_W / 2 + 1, BULL_H / 2, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  if (state === 'playing') drawPlayer();

  // wave message
  if (waveTimer > 0) {
    const alpha = Math.min(1, waveTimer / 20);
    ctx.globalAlpha = alpha;
    ctx.fillStyle   = '#a0c4ff';
    ctx.font        = 'bold 36px Courier New';
    ctx.textAlign   = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(waveMsg, W / 2, H / 2);
    ctx.globalAlpha = 1;
  }
}

function loop() {
  step();
  draw();
  requestAnimationFrame(loop);
}

// static preview
player = { x: W / 2 - PLAYER_W / 2, y: H - 80, invincible: 0 };
enemies = []; playerBullets = []; enemyBullets = [];
waveTimer = 0;
draw();
showOverlay('SPACE SHOOTER', 'SPACE veya tıkla ile başla', false);
requestAnimationFrame(loop);
</script>
</body>
</html>
