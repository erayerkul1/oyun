<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #eee;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 600px;
    padding: 8px 4px;
    font-size: 15px;
    letter-spacing: 1px;
  }
  #hud span { color: #a0c4ff; }
  #wrapper {
    position: relative;
    width: 600px;
    height: 500px;
  }
  canvas {
    display: block;
    background: #0d0d1a;
    border: 2px solid #2a2a4a;
    border-radius: 4px;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 26, 0.85);
    border-radius: 4px;
    gap: 16px;
  }
  #overlay h1 { font-size: 36px; color: #a0c4ff; letter-spacing: 3px; }
  #overlay p  { font-size: 15px; color: #aaa; }
  #overlay .score-display { font-size: 22px; color: #ffd6a5; }
  #overlay.hidden { display: none; }
  /* power-up legend */
  #legend {
    display: flex;
    gap: 18px;
    width: 600px;
    padding: 5px 4px 0;
    font-size: 12px;
    color: #555;
    letter-spacing: 0.5px;
  }
  #legend span { margin-right: 3px; }
</style>
</head>
<body>

<div id="hud">
  <div>PUAN: <span id="scoreVal">0</span></div>
  <div>LEVEL: <span id="levelVal">1</span></div>
  <div>CAN: <span id="livesVal">❤️❤️❤️</span></div>
</div>

<div id="wrapper">
  <canvas id="c" width="600" height="500"></canvas>
  <div id="overlay">
    <h1>BREAKOUT</h1>
    <p class="score-display" id="overlayScore" style="display:none"></p>
    <p id="overlayMsg">SPACE veya tıkla ile başla</p>
    <p style="color:#666;font-size:13px">← → veya fare ile raket</p>
  </div>
</div>
<div id="legend">
  <div><span style="color:#ff6b6b">❤</span> Can +1</div>
  <div><span style="color:#cc5de8">⬡</span> 3'lü top</div>
  <div><span style="color:#ffd43b">⚡</span> Hız arttır</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const overlay      = document.getElementById('overlay');
const overlayMsg   = document.getElementById('overlayMsg');
const overlayScore = document.getElementById('overlayScore');
const scoreEl = document.getElementById('scoreVal');
const levelEl = document.getElementById('levelVal');
const livesEl = document.getElementById('livesVal');

const W = 600, H = 500;

// brick layout
const COLS = 8, ROWS = 5;
const BW = 62, BH = 20, BPAD = 6;
const BOFFX = (W - (COLS * (BW + BPAD) - BPAD)) / 2;
const BOFFY = 55;

const ROW_COLORS = ['#ff6b6b','#ffa94d','#ffe066','#69db7c','#74c0fc'];
const ROW_POINTS = [50, 40, 30, 20, 10];

// paddle
const PADDLE_W = 90, PADDLE_H = 12, PADDLE_Y = H - 35;

// ball
const BALL_R = 7;
const BASE_SPEED = 4.5;

// power-ups
const PU_W = 22, PU_H = 14, PU_SPD = 2.2;
const PU_DROP_CHANCE = 0.28; // 28% per brick
const PU_TYPES = ['life', 'multi', 'speed'];
const PU_COLOR = { life: '#ff6b6b', multi: '#cc5de8', speed: '#ffd43b' };
const PU_LABEL = { life: '❤', multi: '⬡', speed: '⚡' };

// speed boost: how many seconds it lasts
const SPEED_BOOST_TICKS = 60 * 6; // 6 seconds at 60fps

let state = 'idle';
let score, lives, level, bricks, balls, paddle, mouseX;
let powerups; // falling capsules
let speedBoostTicks; // remaining frames of speed boost

function makeBricks() {
  const b = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      b.push({
        x: BOFFX + c * (BW + BPAD),
        y: BOFFY + r * (BH + BPAD),
        alive: true,
        color: ROW_COLORS[r],
        pts:   ROW_POINTS[r]
      });
    }
  }
  return b;
}

function currentSpeed() {
  const base = BASE_SPEED + (level - 1) * 0.4;
  return speedBoostTicks > 0 ? base * 1.6 : base;
}

function makeBall(x, y, angle) {
  const spd = currentSpeed();
  return {
    x, y,
    vx: Math.cos(angle) * spd,
    vy: Math.sin(angle) * spd
  };
}

function launchBalls() {
  const angle = -Math.PI / 2 + (Math.random() - 0.5) * (Math.PI / 3);
  balls = [makeBall(paddle.x + PADDLE_W / 2, PADDLE_Y - BALL_R - 2, angle)];
}

function initGame() {
  score  = 0;
  lives  = 3;
  level  = 1;
  paddle = { x: W / 2 - PADDLE_W / 2 };
  bricks = makeBricks();
  powerups = [];
  speedBoostTicks = 0;
  launchBalls();
  updateHUD();
}

function startLevel() {
  bricks = makeBricks();
  paddle = { x: W / 2 - PADDLE_W / 2 };
  powerups = [];
  speedBoostTicks = 0;
  launchBalls();
  updateHUD();
}

function updateHUD() {
  scoreEl.textContent = score;
  levelEl.textContent = level;
  livesEl.textContent = '❤️'.repeat(Math.max(0, lives));
}

function showOverlay(title, msg, showScore) {
  overlay.classList.remove('hidden');
  overlay.querySelector('h1').textContent = title;
  overlayMsg.textContent = msg;
  if (showScore) {
    overlayScore.style.display = '';
    overlayScore.textContent   = 'PUAN: ' + score;
  } else {
    overlayScore.style.display = 'none';
  }
}
function hideOverlay() { overlay.classList.add('hidden'); }

// ---- input ----
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); handleStart(); }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
});
canvas.addEventListener('click', handleStart);
overlay.addEventListener('click', handleStart);

function handleStart() {
  if (state === 'idle' || state === 'gameover') {
    initGame(); hideOverlay(); state = 'playing';
  } else if (state === 'levelup') {
    level++; startLevel(); hideOverlay(); state = 'playing';
  } else if (state === 'dead') {
    launchBalls(); hideOverlay(); state = 'playing';
  }
}

// ---- power-up effects ----
function applyPowerup(type) {
  if (type === 'life') {
    lives = Math.min(lives + 1, 9);
    updateHUD();
  } else if (type === 'multi') {
    const extra = [];
    for (const b of balls) {
      const spd   = Math.hypot(b.vx, b.vy);
      const baseA = Math.atan2(b.vy, b.vx);
      extra.push(makeBall(b.x, b.y, baseA - 0.4));
      extra.push(makeBall(b.x, b.y, baseA + 0.4));
    }
    balls.push(...extra);
  } else if (type === 'speed') {
    speedBoostTicks = SPEED_BOOST_TICKS;
    // boost existing ball speeds
    for (const b of balls) {
      const spd = Math.hypot(b.vx, b.vy);
      const a   = Math.atan2(b.vy, b.vx);
      const newSpd = currentSpeed();
      b.vx = Math.cos(a) * newSpd;
      b.vy = Math.sin(a) * newSpd;
    }
  }
}

// ---- physics ----
function moveBall(b) {
  b.x += b.vx;
  b.y += b.vy;

  if (b.x - BALL_R < 0)  { b.x = BALL_R;     b.vx = Math.abs(b.vx); }
  if (b.x + BALL_R > W)  { b.x = W - BALL_R; b.vx = -Math.abs(b.vx); }
  if (b.y - BALL_R < 0)  { b.y = BALL_R;     b.vy = Math.abs(b.vy); }

  // paddle
  if (
    b.vy > 0 &&
    b.y + BALL_R >= PADDLE_Y &&
    b.y + BALL_R <= PADDLE_Y + PADDLE_H &&
    b.x >= paddle.x &&
    b.x <= paddle.x + PADDLE_W
  ) {
    b.y = PADDLE_Y - BALL_R;
    const rel   = (b.x - (paddle.x + PADDLE_W / 2)) / (PADDLE_W / 2);
    const angle = rel * (Math.PI / 3);
    const spd   = Math.hypot(b.vx, b.vy);
    b.vx = Math.sin(angle) * spd;
    b.vy = -Math.cos(angle) * spd;
  }

  // bricks
  for (const br of bricks) {
    if (!br.alive) continue;
    if (
      b.x + BALL_R > br.x &&
      b.x - BALL_R < br.x + BW &&
      b.y + BALL_R > br.y &&
      b.y - BALL_R < br.y + BH
    ) {
      br.alive = false;
      score += br.pts;
      updateHUD();

      // maybe drop power-up
      if (Math.random() < PU_DROP_CHANCE) {
        const type = PU_TYPES[Math.floor(Math.random() * PU_TYPES.length)];
        powerups.push({
          x: br.x + BW / 2 - PU_W / 2,
          y: br.y + BH / 2,
          type
        });
      }

      const overlapL = (b.x + BALL_R) - br.x;
      const overlapR = (br.x + BW) - (b.x - BALL_R);
      const overlapT = (b.y + BALL_R) - br.y;
      const overlapB = (br.y + BH) - (b.y - BALL_R);
      if (Math.min(overlapL, overlapR) < Math.min(overlapT, overlapB)) b.vx = -b.vx;
      else b.vy = -b.vy;
      break;
    }
  }
}

function step() {
  if (state !== 'playing') return;

  // speed boost countdown
  if (speedBoostTicks > 0) {
    speedBoostTicks--;
    if (speedBoostTicks === 0) {
      // normalise ball speeds back
      const normal = BASE_SPEED + (level - 1) * 0.4;
      for (const b of balls) {
        const a = Math.atan2(b.vy, b.vx);
        b.vx = Math.cos(a) * normal;
        b.vy = Math.sin(a) * normal;
      }
    }
  }

  // paddle movement
  const PADDLE_SPD = 6;
  if (keys['ArrowLeft'])  paddle.x -= PADDLE_SPD;
  if (keys['ArrowRight']) paddle.x += PADDLE_SPD;
  if (mouseX !== undefined) paddle.x = mouseX - PADDLE_W / 2;
  paddle.x = Math.max(0, Math.min(W - PADDLE_W, paddle.x));

  // move all balls
  for (const b of balls) moveBall(b);

  // remove fallen balls
  const before = balls.length;
  balls = balls.filter(b => b.y - BALL_R <= H);

  if (balls.length === 0) {
    lives--;
    powerups = [];
    updateHUD();
    if (lives <= 0) {
      state = 'gameover';
      showOverlay('GAME OVER', 'SPACE veya tıkla ile yeniden başla', true);
    } else {
      state = 'dead';
      showOverlay('CAN KAYBETTİN', 'SPACE veya tıkla ile devam et', false);
    }
    return;
  }

  // power-up capsules
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += PU_SPD;
    // catch with paddle
    if (
      p.y + PU_H >= PADDLE_Y &&
      p.y <= PADDLE_Y + PADDLE_H &&
      p.x + PU_W >= paddle.x &&
      p.x <= paddle.x + PADDLE_W
    ) {
      applyPowerup(p.type);
      powerups.splice(i, 1);
      continue;
    }
    if (p.y > H) powerups.splice(i, 1);
  }

  // all bricks cleared
  if (bricks.every(b => !b.alive)) {
    state = 'levelup';
    showOverlay('LEVEL ' + (level + 1), 'SPACE veya tıkla ile devam et', false);
  }
}

// ---- draw ----
function draw() {
  ctx.clearRect(0, 0, W, H);

  // bricks
  for (const br of bricks) {
    if (!br.alive) continue;
    ctx.fillStyle = br.color;
    ctx.beginPath();
    ctx.roundRect(br.x, br.y, BW, BH, 3);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.roundRect(br.x + 2, br.y + 2, BW - 4, 5, 2);
    ctx.fill();
  }

  // power-up capsules
  for (const p of powerups) {
    const col = PU_COLOR[p.type];
    ctx.fillStyle = col + '33'; // dim bg
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, PU_W, PU_H, 7);
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, PU_W, PU_H, 7);
    ctx.stroke();
    ctx.fillStyle = col;
    ctx.font = '11px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(PU_LABEL[p.type], p.x + PU_W / 2, p.y + PU_H / 2);
  }

  // paddle (yellow tint during speed boost)
  const p0 = speedBoostTicks > 0 ? '#ffd43b' : '#74c0fc';
  const p1 = speedBoostTicks > 0 ? '#f08c00' : '#339af0';
  const grad = ctx.createLinearGradient(paddle.x, PADDLE_Y, paddle.x, PADDLE_Y + PADDLE_H);
  grad.addColorStop(0, p0);
  grad.addColorStop(1, p1);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(paddle.x, PADDLE_Y, PADDLE_W, PADDLE_H, 6);
  ctx.fill();

  // balls
  if (state === 'playing') {
    for (const b of balls) {
      ctx.shadowColor = '#a0c4ff';
      ctx.shadowBlur  = 10;
      ctx.beginPath();
      ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
}

function loop() {
  step();
  draw();
  requestAnimationFrame(loop);
}

// static preview
showOverlay('BREAKOUT', 'SPACE veya tıkla ile başla', false);
paddle   = { x: W / 2 - PADDLE_W / 2 };
bricks   = makeBricks();
balls    = [{ x: W / 2, y: H / 2, vx: 0, vy: 0 }];
powerups = [];
speedBoostTicks = 0;
draw();
requestAnimationFrame(loop);
</script>
</body>
</html>
