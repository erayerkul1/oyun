// ── game state ──────────────────────────────────────────────
let state='idle',score,lives,levelIdx,lvl;
let player,enemies,coins,powerups,camX;
let coyoteT=0,jumpBuf=0,jumpHoldF=0,tick=0;

const keys={};
window.addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyZ'].includes(e.code)) e.preventDefault();
  if(!keys[e.code]){
    keys[e.code]=true;
    if(state==='playing'&&(e.code==='ArrowUp'||e.code==='Space'||e.code==='KeyZ')) jumpBuf=JBUF;
    if((e.code==='Space'||e.code==='Enter')&&(state==='idle'||state==='gameover'||state==='win')) startGame();
  }
});
window.addEventListener('keyup',e=>{ keys[e.code]=false; });
canvas.addEventListener('click',()=>{ if(state==='idle'||state==='gameover'||state==='win') startGame(); });

function startGame(){ score=0;lives=3;levelIdx=0;loadLevel(0);state='playing'; }

function loadLevel(idx){
  lvl=LEVELS[idx];
  player={x:60,y:265,vx:0,vy:0,grounded:false,facing:1,invincible:0,
          augSpeed:0,augDjump:0,augShield:false,augStar:0,djumpUsed:false};
  enemies =lvl.enemies .map(e=>({...e,alive:true,wobble:0}));
  coins   =lvl.coins   .map(c=>({...c,alive:true,phase:Math.random()*Math.PI*2}));
  powerups=(lvl.powerups||[]).map(p=>({...p,alive:true,phase:Math.random()*Math.PI*2}));
  camX=0;coyoteT=0;jumpBuf=0;jumpHoldF=0;
}

function hit(ax,ay,aw,ah,bx,by,bw,bh){ return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by; }

// ── step ────────────────────────────────────────────────────
function step(){
  if(state!=='playing') return;
  tick++;
  if(jumpBuf>0) jumpBuf--;
  if(coyoteT>0) coyoteT--;

  // augment timers
  if(player.augSpeed>0) player.augSpeed--;
  if(player.augDjump>0){ player.augDjump--; }else{ player.djumpUsed=false; }
  if(player.augStar>0)  player.augStar--;

  const spd=RUN_SPD*(player.augSpeed>0?1.55:1);
  const onGround=player.grounded;
  const accel=onGround?0.38:0.38*AIR_MULT;
  if(keys['ArrowLeft']) { player.vx-=accel; player.facing=-1; }
  if(keys['ArrowRight']){ player.vx+=accel; player.facing= 1; }
  player.vx=Math.max(-spd,Math.min(spd,player.vx));
  if(!keys['ArrowLeft']&&!keys['ArrowRight']) player.vx*=FRICTION;
  if(Math.abs(player.vx)<0.08) player.vx=0;

  player.vy=Math.min(player.vy+GRAV,MAX_FALL);

  // jump (ground/coyote)
  if(jumpBuf>0&&(onGround||coyoteT>0)){
    player.vy=JUMP_V; jumpBuf=0; coyoteT=0;
    jumpHoldF=JUMP_HOLD_MAX; player.grounded=false;
  }
  // double jump (mid-air, uses augDjump)
  else if(jumpBuf>0&&!onGround&&player.augDjump>0&&!player.djumpUsed){
    player.vy=JUMP_V*0.88; jumpBuf=0; player.djumpUsed=true;
    jumpHoldF=JUMP_HOLD_MAX;
  }
  if(jumpHoldF>0){
    if(keys['ArrowUp']||keys['Space']||keys['KeyZ']){ player.vy+=JUMP_HOLD; jumpHoldF--; }
    else jumpHoldF=0;
  }

  // move X
  player.x+=player.vx;
  player.x=Math.max(0,Math.min(lvl.worldW-PW,player.x));
  for(const p of lvl.platforms){
    if(hit(player.x,player.y,PW,PH,p.x,p.y,p.w,p.h)){
      if(player.vx>0){player.x=p.x-PW;player.vx=0;}
      else if(player.vx<0){player.x=p.x+p.w;player.vx=0;}
    }
  }

  // move Y
  const wasGround=player.grounded;
  player.grounded=false;
  player.y+=player.vy;
  for(const p of lvl.platforms){
    if(hit(player.x,player.y,PW,PH,p.x,p.y,p.w,p.h)){
      if(player.vy>=0){player.y=p.y-PH;player.vy=0;player.grounded=true;}
      else{player.y=p.y+p.h;player.vy=0;jumpHoldF=0;}
    }
  }
  if(player.grounded) player.djumpUsed=false;
  if(wasGround&&!player.grounded) coyoteT=COYOTE;

  if(player.y>H+80){ die(); return; }

  // enemies
  for(const e of enemies){
    if(!e.alive) continue;
    const espd=e.spd||1.6;
    e.x+=e.dir*espd; e.wobble+=0.18;
    if(e.x<=e.left){e.dir=1;e.x=e.left;}
    if(e.x>=e.right-EW){e.dir=-1;e.x=e.right-EW;}
    if(player.invincible>0||player.augStar>0) continue;
    if(hit(player.x,player.y,PW,PH,e.x,e.y,EW,EH)){
      const stomped=player.vy>0&&(player.y+PH-player.vy)<e.y+EH*0.45;
      if(stomped){e.alive=false;score+=50;player.vy=STOMP_V;jumpHoldF=0;}
      else{die();return;}
    }
  }

  // coins
  for(const c of coins){
    if(!c.alive) continue;
    c.phase+=0.07;
    if(hit(player.x,player.y,PW,PH,c.x-COIN_R,c.y-COIN_R,COIN_R*2,COIN_R*2)){c.alive=false;score+=10;}
  }

  // power-ups
  for(const p of powerups){
    if(!p.alive) continue;
    p.phase+=0.06;
    if(hit(player.x,player.y,PW,PH,p.x-AUG_R,p.y-AUG_R,AUG_R*2,AUG_R*2)){
      p.alive=false;
      if(p.type==='speed')  player.augSpeed =AUG_DUR.speed;
      if(p.type==='djump') {player.augDjump =AUG_DUR.djump;player.djumpUsed=false;}
      if(p.type==='shield') player.augShield=true;
      if(p.type==='star')   player.augStar  =AUG_DUR.star;
    }
  }

  if(player.invincible>0) player.invincible--;

  // flag
  const fx=lvl.flag.x;
  if(player.x+PW>fx&&player.x<fx+20&&player.y+PH>220&&player.y<GROUND_Y){
    score+=100*(levelIdx+1);
    if(levelIdx<LEVELS.length-1){levelIdx++;loadLevel(levelIdx);}
    else state='win';
    return;
  }

  const target=player.x-180;
  camX+=(target-camX)*0.1;
  camX=Math.max(0,Math.min(lvl.worldW-W,camX));
}

function die(){
  if(player.augShield){player.augShield=false;player.invincible=INVINCIBLE_F*2;return;}
  lives--;
  if(lives<=0){state='gameover';return;}
  player.x=60;player.y=265;player.vx=0;player.vy=0;
  player.invincible=INVINCIBLE_F*2;player.augStar=0;
  camX=0;coyoteT=0;jumpBuf=0;jumpHoldF=0;
}

// ── draw ────────────────────────────────────────────────────
function drawBG(){
  const sky=ctx.createLinearGradient(0,0,0,H);
  // tint gets darker/redder as levels increase
  const t=levelIdx/9;
  const r1=Math.round(26+t*60), g1=Math.round(58-t*20), b1=Math.round(96-t*30);
  const r2=Math.round(46+t*80), g2=Math.round(96-t*30), b2=Math.round(148-t*50);
  sky.addColorStop(0,`rgb(${r1},${g1},${b1})`);
  sky.addColorStop(1,`rgb(${r2},${g2},${b2})`);
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  // mountains
  const mc=`rgb(${Math.round(27+t*50)},${Math.round(74-t*20)},${Math.round(122-t*30)})`;
  ctx.fillStyle=mc;
  const mx=-(camX*0.25)%320;
  for(let i=-1;i<5;i++){
    const bx=mx+i*320;
    ctx.beginPath();ctx.moveTo(bx,H-60);ctx.lineTo(bx+80,H-60-90);ctx.lineTo(bx+160,H-60-50);ctx.lineTo(bx+230,H-60-110);ctx.lineTo(bx+320,H-60);ctx.fill();
  }
  const hc=`rgb(${Math.round(30+t*50)},${Math.round(90-t*20)},${Math.round(138-t*30)})`;
  ctx.fillStyle=hc;
  const hx=-(camX*0.5)%400;
  for(let i=-1;i<5;i++){
    const bx=hx+i*400;
    ctx.beginPath();ctx.moveTo(bx,H-60);ctx.bezierCurveTo(bx+100,H-60-50,bx+200,H-60-55,bx+400,H-60);ctx.fill();
  }
}

function drawPlatform(p){
  const sx=p.x-camX,sy=p.y;
  if(sx+p.w<-10||sx>W+10) return;
  if(p.g){
    ctx.fillStyle='#7a3b10';ctx.fillRect(sx,sy,p.w,p.h);
    ctx.fillStyle='#51cf66';ctx.fillRect(sx,sy,p.w,6);
    ctx.fillStyle='#40c057';ctx.fillRect(sx,sy+6,p.w,4);
  }else{
    ctx.fillStyle='#9c6b18';ctx.fillRect(sx,sy,p.w,p.h);
    ctx.fillStyle='rgba(0,0,0,0.15)';
    for(let xi=sx;xi<sx+p.w;xi+=28) ctx.fillRect(xi,sy+1,2,p.h-1);
    ctx.fillStyle='#69db7c';ctx.fillRect(sx,sy,p.w,3);
  }
  ctx.fillStyle='rgba(0,0,0,0.18)';ctx.fillRect(sx+p.w-3,sy+4,3,p.h-4);
}

function drawCoin(c){
  if(!c.alive) return;
  const sx=c.x-camX;if(sx<-20||sx>W+20) return;
  const bob=Math.sin(c.phase)*2.5;
  ctx.shadowColor='#ffd43b';ctx.shadowBlur=10;
  ctx.fillStyle='#ffd43b';ctx.beginPath();ctx.arc(sx,c.y+bob,COIN_R,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.arc(sx-2,c.y+bob-2,2.5,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
}

function drawPowerup(p){
  if(!p.alive) return;
  const sx=p.x-camX;if(sx<-30||sx>W+30) return;
  const bob=Math.sin(p.phase)*3;
  const glow=AUG_GLOW[p.type];
  ctx.shadowColor=glow;ctx.shadowBlur=14;
  // hexagon background
  ctx.fillStyle=glow+'55';
  ctx.beginPath();
  for(let i=0;i<6;i++){const a=i/6*Math.PI*2-Math.PI/6;ctx.lineTo(p.x-camX+Math.cos(a)*AUG_R,p.y+bob+Math.sin(a)*AUG_R);}
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=glow;ctx.lineWidth=2;ctx.stroke();
  ctx.shadowBlur=0;
  // emoji label
  ctx.font='13px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(AUG_LABEL[p.type],p.x-camX,p.y+bob);
}

function drawEnemy(e){
  if(!e.alive) return;
  const sx=e.x-camX;if(sx<-40||sx>W+40) return;
  const bob=Math.sin(e.wobble)*2;
  const fast=!!(e.spd&&e.spd>2);
  const cx=sx+EW/2,cy=e.y+EH/2+bob;
  ctx.shadowColor=fast?'#ff6b6b':'#40c057';ctx.shadowBlur=6;
  ctx.fillStyle=fast?'#ff9999':'#51cf66';
  ctx.beginPath();ctx.ellipse(cx,cy,EW/2,EH/2,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=fast?'#ffb3b3':'#69db7c';
  ctx.beginPath();ctx.ellipse(cx,cy+4,EW/2-4,EH/4,0,0,Math.PI,false);ctx.fill();
  ctx.shadowBlur=0;
  const ex=e.dir>0?cx+5:cx-5;
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(ex-3,cy-3,3.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(ex+3,cy-3,3.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath();ctx.arc(ex-3+e.dir,cy-3,1.8,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(ex+3+e.dir,cy-3,1.8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=fast?'#cc0000':'#2d8a3e';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(cx,cy+2,5,fast?0.5:0.2,fast?Math.PI-0.5:Math.PI-0.2);ctx.stroke();
}

function drawPlayer(){
  const sx=player.x-camX,sy=player.y;
  if(player.invincible>0&&Math.floor(player.invincible/5)%2===0) return;
  ctx.save();
  ctx.translate(sx+PW/2,sy+PH/2);
  if(player.facing<0) ctx.scale(-1,1);

  // star glow
  if(player.augStar>0){ctx.shadowColor='#ffe066';ctx.shadowBlur=18;}

  const run=Math.abs(player.vx)>0.4&&player.grounded;
  const lp=run?Math.sin(tick*0.28)*8:0;
  ctx.fillStyle='#1864ab';
  ctx.fillRect(-7,PH/2-12,6,10+lp);ctx.fillRect(1,PH/2-12,6,10-lp);
  ctx.fillStyle='#333';
  ctx.fillRect(-8,PH/2-4+lp,8,4);ctx.fillRect(0,PH/2-4-lp,8,4);

  // body color changes with augments
  const bodyCol=player.augSpeed>0?'#ff9f43':player.augStar>0?'#ffd43b':'#339af0';
  ctx.fillStyle=bodyCol;
  ctx.beginPath();ctx.roundRect(-PW/2,-(PH/2)+10,PW,PH-20,3);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.beginPath();ctx.roundRect(-PW/2+2,-(PH/2)+11,6,PH-24,2);ctx.fill();

  // shield ring
  if(player.augShield){
    ctx.strokeStyle='#ff6b6b';ctx.lineWidth=2.5;ctx.shadowColor='#ff6b6b';ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(0,0,PW/2+5,0,Math.PI*2);ctx.stroke();
  }
  ctx.shadowBlur=0;

  ctx.fillStyle='#fab387';ctx.beginPath();ctx.ellipse(0,-PH/2+8,10,10,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8B4513';ctx.beginPath();ctx.ellipse(0,-PH/2+2,10,6,0,Math.PI,0);ctx.fill();
  // djump indicator (little wings)
  if(player.augDjump>0){
    ctx.fillStyle='#a5d8ff';
    ctx.beginPath();ctx.ellipse(-PW/2-4,-(PH/2)+14,6,4,-0.4,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#1a1a2e';ctx.beginPath();ctx.arc(4,-PH/2+7,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(5,-PH/2+6,1,0,Math.PI*2);ctx.fill();
  const arm=run?Math.sin(tick*0.28)*6:0;
  ctx.fillStyle=bodyCol;ctx.fillRect(PW/2-2,-(PH/2)+14,5,10+arm);
  ctx.restore();
}

function drawFlag(){
  const sx=lvl.flag.x-camX;
  if(sx<-30||sx>W+30) return;
  ctx.strokeStyle='#bbb';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(sx+2,GROUND_Y);ctx.lineTo(sx+2,GROUND_Y-85);ctx.stroke();
  const t=tick*0.07;
  ctx.fillStyle='#ff4444';
  ctx.beginPath();
  ctx.moveTo(sx+2,GROUND_Y-85);
  ctx.bezierCurveTo(sx+18,GROUND_Y-85+Math.sin(t)*4,sx+28,GROUND_Y-68+Math.sin(t+0.6)*4,sx+18,GROUND_Y-62+Math.sin(t+1.2)*3);
  ctx.lineTo(sx+2,GROUND_Y-62);ctx.closePath();ctx.fill();
}

function drawHUD(){
  ctx.fillStyle='rgba(5,5,20,0.7)';ctx.fillRect(0,0,W,32);
  ctx.fillStyle='#a0c4ff';ctx.font='13px Courier New';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('PUAN: '+score,12,16);
  ctx.textAlign='center';ctx.fillStyle='#ffd6a5';
  ctx.fillText('LEVEL '+(levelIdx+1)+' / '+LEVELS.length,W/2,16);
  ctx.textAlign='right';ctx.fillText('❤️'.repeat(Math.max(0,lives)),W-10,16);

  // active augments bar
  const aug=[];
  if(player.augSpeed >0) aug.push({lbl:'⚡',col:'#ffd43b',t:player.augSpeed /AUG_DUR.speed});
  if(player.augDjump >0) aug.push({lbl:'🦅',col:'#74c0fc',t:player.augDjump /AUG_DUR.djump});
  if(player.augShield)   aug.push({lbl:'🛡',col:'#ff6b6b',t:1});
  if(player.augStar  >0) aug.push({lbl:'⭐',col:'#ffe066',t:player.augStar  /AUG_DUR.star});
  aug.forEach((a,i)=>{
    const bx=10+i*38,by=34;
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(bx,by,32,6);
    ctx.fillStyle=a.col;ctx.fillRect(bx,by,32*a.t,6);
    ctx.font='13px serif';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(a.lbl,bx+16,by+8);
  });
}

function drawOverlay(title,sub,hint=''){
  ctx.fillStyle='rgba(5,5,20,0.88)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#a0c4ff';ctx.font='bold 32px Courier New';ctx.fillText(title,W/2,H/2-30);
  if(sub){ctx.fillStyle='#ffd6a5';ctx.font='18px Courier New';ctx.fillText(sub,W/2,H/2+10);}
  if(hint){ctx.fillStyle='#445';ctx.font='12px Courier New';ctx.fillText(hint,W/2,H/2+40);}
}

function draw(){
  drawBG();
  for(const p of lvl.platforms) drawPlatform(p);
  drawFlag();
  for(const c of coins) drawCoin(c);
  for(const p of powerups) drawPowerup(p);
  for(const e of enemies) drawEnemy(e);
  if(state==='playing') drawPlayer();
  drawHUD();
  if(state==='idle')    drawOverlay('PLATFORMER','SPACE veya tıkla','← → koş | ↑/SPACE zıpla | augment topla!');
  else if(state==='gameover') drawOverlay('GAME OVER','PUAN: '+score,'SPACE veya tıkla');
  else if(state==='win')      drawOverlay('TEBRİKLER!','PUAN: '+score,'SPACE veya tıkla');
}

function loop(){ step();draw();requestAnimationFrame(loop); }

// idle preview
lvl=LEVELS[0];
player={x:60,y:265,vx:0,vy:0,grounded:true,facing:1,invincible:0,augSpeed:0,augDjump:0,augShield:false,augStar:0,djumpUsed:false};
enemies=lvl.enemies.map(e=>({...e,alive:true,wobble:0}));
coins=lvl.coins.map(c=>({...c,alive:true,phase:Math.random()*Math.PI*2}));
powerups=(lvl.powerups||[]).map(p=>({...p,alive:true,phase:Math.random()*Math.PI*2}));
score=0;lives=3;levelIdx=0;camX=0;
requestAnimationFrame(loop);
</script>
